{% extends "base.html" %}{% block heading %}Cupones y promociones{% endblock %}{% block content %}
<div class="grid-main"><section class="panel"><h3>Crear cupón</h3><form method="post" class="form single"><label>Código<input name="code" placeholder="PARKIA10" required></label><label>Descuento (%)<input name="discount" type="number" min="1" max="80" required></label><button class="btn primary">Crear cupón</button></form></section><section class="panel"><h3>Cupones disponibles</h3><div class="table-wrap"><table><tr><th>CÓDIGO</th><th>DESCUENTO</th><th>ESTADO</th></tr>{% for c in coupons %}<tr><td><b>{{c.code}}</b></td><td>{{c.discount}}%</td><td><span class="status active">Activo</span></td></tr>{% else %}<tr><td colspan="3">No hay cupones.</td></tr>{% endfor %}</table></div></section></div>{% endblock %}
